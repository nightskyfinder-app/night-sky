<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<style>html{color-scheme:dark}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Night Sky Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-screen sky canvas; slim top bar (place + time), bottom bar (heading + controls), slide-up info sheet. Deliberately dark-only: it's a night tool. */
:root {
  color-scheme: dark;
  --ink: #05070f;          /* deep sky */
  --panel: rgba(14, 18, 34, 0.86);
  --line: rgba(150, 170, 230, 0.18);
  --fg: #e3e7f5;
  --muted: #8e97b8;
  --accent: #f2c46d;       /* planet gold */
  --cons: rgba(120, 160, 255, 0.42);
  --font-ui: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); font-family: var(--font-ui); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
body.red { filter: sepia(1) saturate(6) hue-rotate(-50deg) brightness(0.72); }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#sky.dragging { cursor: grabbing; }

.bar { position: fixed; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-inline: 16px; pointer-events: none; }
.bar > * { pointer-events: auto; }
.top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 12px); }
.bottom { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); align-items: flex-end; }

.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); color: var(--fg); border-radius: 999px; padding: 8px 14px; font: 500 14px/1 var(--font-ui); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer; min-height: 38px; }
.chip:focus-visible, .round:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip small { color: var(--muted); font: 400 12px/1 var(--font-data); }
.time { font: 500 13px/1 var(--font-data); color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 10px 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-variant-numeric: tabular-nums; }

.heading { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.heading .dir { font: 600 26px/1 var(--font-ui); letter-spacing: 0.04em; text-shadow: 0 1px 8px #000; }
.heading .alt { font: 400 12px/1.2 var(--font-data); color: var(--muted); letter-spacing: 0.04em; text-shadow: 0 1px 6px #000; }
.tools { display: flex; gap: 8px; }
.round { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); color: var(--fg); cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 0; }
.round svg { width: 22px; height: 22px; }
.round[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 64px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 14px; max-width: min(92vw, 420px); text-align: center; line-height: 1.4; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; margin-inline: auto; max-width: 520px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 18px 20px calc(env(safe-area-inset-bottom, 0px) + 20px); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 -10px 40px rgba(0,0,0,0.5); }
.sheet header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.kind { font: 500 11px/1 var(--font-data); text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); }
.sheet h2 { margin: 6px 0 2px; font: 600 26px/1.1 var(--font-ui); text-wrap: balance; }
.sheet .sub { color: var(--muted); font-size: 15px; }
.close { background: none; border: 0; color: var(--muted); font-size: 26px; line-height: 1; cursor: pointer; padding: 4px 6px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin: 16px 0 0; }
.facts div { min-width: 0; }
.facts dt { font: 500 11px/1 var(--font-data); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 5px; }
.facts dd { margin: 0; font: 500 15px/1.3 var(--font-data); font-variant-numeric: tabular-nums; }
.note { margin: 14px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }

.place-form { display: grid; gap: 12px; margin-top: 14px; }
.place-form label { display: grid; gap: 6px; font: 500 11px/1 var(--font-data); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.place-form select, .place-form input { font: 400 16px/1.2 var(--font-ui); color: var(--fg); background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; box-sizing: border-box; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { font: 600 15px/1 var(--font-ui); background: var(--accent); color: #1b1404; border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<canvas id="sky" aria-label="Interactive sky map. Drag to look around, pinch or scroll to zoom, tap an object for details."></canvas>

<div class="bar top">
  <button class="chip" id="placeBtn" type="button" aria-label="Change location">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <span id="placeName">—</span><small id="placeCoords"></small>
  </button>
  <div class="time" id="clock">--:--</div>
</div>

<div class="toast" id="toast" hidden></div>

<div class="bar bottom" id="bottomBar">
  <div class="heading" aria-live="polite">
    <div class="dir" id="dir">S</div>
    <div class="alt" id="alt">30° up · 90° view</div>
  </div>
  <div class="tools">
    <button class="round" id="motionBtn" type="button" aria-pressed="false" title="Point your phone at the sky" aria-label="Point your phone at the sky">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg>
    </button>
    <button class="round" id="labelsBtn" type="button" aria-pressed="true" title="Show names and lines" aria-label="Show names and constellation lines">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="5" cy="17" r="1.6"/><circle cx="11" cy="8" r="1.6"/><circle cx="19" cy="12" r="1.6"/><path d="M6.2 15.6 10 9.4M12.5 8.8l5 2.4"/></svg>
    </button>
    <button class="round" id="redBtn" type="button" aria-pressed="false" title="Red night mode" aria-label="Red night mode keeps your eyes dark-adapted">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</div>

<section class="sheet" id="info" hidden aria-live="polite">
  <header>
    <div style="min-width:0">
      <div class="kind" id="infoKind"></div>
      <h2 id="infoName"></h2>
      <div class="sub" id="infoSub"></div>
    </div>
    <button class="close" id="infoClose" type="button" aria-label="Close details">×</button>
  </header>
  <dl class="facts" id="infoFacts"></dl>
  <p class="note" id="infoNote"></p>
</section>

<section class="sheet" id="placeSheet" hidden>
  <header>
    <div>
      <div class="kind">Your location</div>
      <h2>Where are you watching from?</h2>
    </div>
    <button class="close" id="placeClose" type="button" aria-label="Close">×</button>
  </header>
  <form class="place-form" id="placeForm">
    <label for="citySel">City
      <select id="citySel"></select>
    </label>
    <div class="row2">
      <label for="latIn">Latitude
        <input id="latIn" type="number" step="0.01" min="-90" max="90" inputmode="decimal">
      </label>
      <label for="lonIn">Longitude
        <input id="lonIn" type="number" step="0.01" min="-180" max="180" inputmode="decimal">
      </label>
    </div>
    <div class="btns">
      <button class="btn" type="submit">Use this location</button>
      <button class="btn ghost" type="button" id="gpsBtn">Use GPS</button>
    </div>
    <p class="note" id="placeNote">Negative latitude is south, negative longitude is west.</p>
  </form>
</section>

function openPlace() {
  hideInfo();
  const idx = CITIES.findIndex(c => c[0] === place.name);
  sel.value = idx >= 0 ? String(idx) : "custom";
  $("latIn").value = place.lat; $("lonIn").value = place.lon;
  $("placeSheet").hidden = false; $("bottomBar").hidden = true;
}
function closePlace() { $("placeSheet").hidden = true; $("bottomBar").hidden = false; }
$("placeBtn").onclick = openPlace; $("placeClose").onclick = closePlace;
sel.onchange = () => { if (sel.value !== "custom") { const c = CITIES[+sel.value]; $("latIn").value = c[1]; $("lonIn").value = c[2]; } };
["latIn", "lonIn"].forEach(id => $(id).addEventListener("input", () => sel.value = "custom"));
$("placeForm").addEventListener("submit", e => {
  e.preventDefault();
  const lat = parseFloat($("latIn").value), lon = parseFloat($("lonIn").value);
  if (!(lat >= -90 && lat <= 90) || !(lon >= -180 && lon <= 180)) { $("placeNote").textContent = "Latitude must be between -90 and 90, longitude between -180 and 180."; return; }
  const name = sel.value === "custom" ? "My spot" : CITIES[+sel.value][0];
  setPlace({ name, lat, lon }); closePlace();
});
$("gpsBtn").onclick = () => {
  if (!navigator.geolocation) { $("placeNote").textContent = "GPS isn't available here. Pick a city or type coordinates."; return; }
  $("placeNote").textContent = "Finding you…";
  navigator.geolocation.getCurrentPosition(
    pos => { setPlace({ name: "My location", lat: +pos.coords.latitude.toFixed(3), lon: +pos.coords.longitude.toFixed(3) }); closePlace(); toast("Location set from GPS."); },
    () => { $("placeNote").textContent = "This view can't use GPS. Pick the nearest city or type your coordinates."; },
    { timeout: 8000, maximumAge: 600000 }
  );
};
function setPlace(p) { place = p; observer = new A.Observer(p.lat, p.lon, 0); store("sky.place", p); updatePlace(); computeFrame(); draw(); }

/* ---------- start ---------- */
updatePlace(); updateClock(); computeFrame();
// open facing the brightest planet that's up, otherwise south
(function aim() {
  const up = frame.bodies.filter(b => b.body !== "Sun" && b.h[2] > 0.15).sort((a, b) => a.mag - b.mag);
  if (frame.sunAlt < -6 && up.length) { const [az, alt] = toAzAlt(up[0].h); view.az = az; view.alt = Math.min(60, Math.max(15, alt)); }
  else view.az = place.lat >= 0 ? 180 : 0;
})();
resize();
window.addEventListener("resize", resize);
setInterval(() => { now = new Date(); updateClock(); computeFrame(); draw(); }, 15000);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>
